quarkus.http.host=0.0.0.0
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:cloudlib}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudlib}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

quarkus.oidc.enabled=${OIDC_ENABLED:true}
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/cloudlib}
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${OIDC_API_CLIENT_ID:cloudlib-api}
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.audience=${OIDC_API_AUDIENCE:cloudlib-api}
quarkus.devservices.enabled=false

quarkus.micrometer.binder.http-server.percentiles-histogram=true
quarkus.micrometer.binder.http-server.histogram=true
quarkus.micrometer.binder.http-server.percentiles=0.5,0.9,0.95,0.99
