quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:cloudlib}
quarkus.datasource.password=${DB_PASSWORD:cloudpass12345}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudlib}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# Keycloak belum tersedia, OIDC dimatikan dulu
quarkus.oidc.enabled=false
quarkus.devservices.enabled=false
