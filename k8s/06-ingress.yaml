apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudlib-ingress
  namespace: cloudlib
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: cloudlib.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudlib-service
                port:
                  number: 8080
